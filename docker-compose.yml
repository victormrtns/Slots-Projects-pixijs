services:
  backend:
    build: ./back
    container_name: slot-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:///./data/slot.db
      STARTING_BALANCE: "4000"
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
    volumes:
      - ./back/data:/app/data

  frontend:
    build: ./front
    container_name: slot-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: http://localhost:8000
    depends_on:
      - backend
